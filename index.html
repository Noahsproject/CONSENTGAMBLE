const NORMAL=[
['Was bedeutet der Begriff Consent (Einvernehmlichkeit)?','Consent bedeutet, dass alle beteiligten Personen freiwillig und bewusst mit etwas einverstanden sind.'],
['Warum ist gegenseitiges Einverständnis in einer Beziehung wichtig?','Weil sich beide Personen respektiert, sicher und wohlfühlen sollen. Es zeigt, dass man die Wünsche und Grenzen des anderen ernst nimmt.'],
['Woran erkennt man, dass eine Person wirklich einverstanden ist?','Daran, dass sie freiwillig und eindeutig Ja sagt und sich dabei nicht unter Druck gesetzt fühlt.'],
['Warum ist es wichtig, vor körperlichem Kontakt nach Zustimmung zu fragen?','Damit man sicher sein kann, dass die andere Person damit einverstanden ist und sich wohlfühlt.'],
['Kann man seine Zustimmung jederzeit zurückziehen?','Ja. Jeder Mensch darf seine Meinung jederzeit ändern. Ein vorheriges Ja bedeutet nicht, dass man immer weiter zustimmen muss.'],
['Bedeutet Schweigen automatisch Zustimmung? Warum nicht?','Nein. Schweigen bedeutet nicht automatisch Ja. Eine Person könnte unsicher sein oder sich nicht trauen, etwas zu sagen.'],
['Welche Rolle spielt Kommunikation beim Thema Consent?','Kommunikation hilft dabei, Wünsche, Gefühle und persönliche Grenzen auszudrücken und Missverständnisse zu vermeiden.'],
['Warum ist es wichtig, die persönlichen Grenzen anderer Menschen zu respektieren?','Weil jeder Mensch eigene Grenzen hat und selbst entscheiden darf, was sich für ihn richtig oder falsch anfühlt.'],
['Wie kann man reagieren, wenn jemand Nein sagt?','Man sollte das Nein akzeptieren, keinen Druck ausüben und die Entscheidung respektieren.'],
['Kann Zustimmung unter Druck als freiwillig gelten?','Nein. Zustimmung muss freiwillig sein. Wenn jemand aus Angst oder wegen Druck zustimmt, ist das keine freie Entscheidung.'],
['Welche Bedeutung hat Consent in sozialen Medien, beispielsweise beim Teilen von Fotos?','Man sollte andere Personen fragen, bevor man Fotos oder persönliche Informationen von ihnen veröffentlicht oder weiterleitet.'],
['Wie unterscheidet sich Zustimmung von Überredung?','Zustimmung ist eine freiwillige Entscheidung. Überredung kann dazu führen, dass jemand etwas tut, obwohl er es eigentlich nicht möchte.'],
['Warum muss Consent von allen Beteiligten freiwillig gegeben werden?','Damit sich alle Beteiligten sicher und respektiert fühlen und niemand zu etwas gezwungen wird.'],
['Wie kann man in einer Beziehung offen über persönliche Grenzen sprechen?','Indem man ehrlich miteinander redet, aufmerksam zuhört und die Gefühle und Wünsche des anderen ernst nimmt.'],
['Was kann jeder Einzelne tun, um eine Kultur des gegenseitigen Respekts und Consent zu fördern?','Man kann andere respektieren, Grenzen akzeptieren, nachfragen, wenn man unsicher ist, und niemanden unter Druck setzen.']];
const BONUS=[
['Eine Person sagt zuerst Ja, möchte dann aber aufhören. Was ist jetzt wichtig?','Sofort aufhören, das geänderte Nein respektieren und keinen Druck machen. Zustimmung kann jederzeit zurückgezogen werden.'],
['Eine Klassenchat-Gruppe drängt jemanden, ein peinliches Foto zu posten. Nach langem Überreden sagt die Person Ja. Ist das freiwillige Zustimmung?','Nein. Durch Gruppendruck kann eine Entscheidung unfrei sein. Das Foto sollte nicht ohne freiwillige Zustimmung veröffentlicht werden.'],
['Jemand hat gestern einem Umarmen zugestimmt. Darf man die Person heute einfach wieder umarmen? Begründe.','Nicht automatisch. Eine frühere Zustimmung gilt nicht unbegrenzt. Man sollte auf die aktuelle Zustimmung achten und gegebenenfalls nachfragen.'],
['Eine Freundin möchte nicht, dass ihr Standort geteilt wird. Andere finden das übertrieben. Was wäre respektvoll?','Ihre Grenze akzeptieren und ihren Standort nicht teilen, auch wenn andere das anders sehen.'],
['Ein Mitschüler lacht nervös, als jemand seine Mütze wegnimmt, sagt aber nichts. Ist das automatisch okay?','Nein. Nervöses Lachen oder Schweigen ist keine eindeutige Zustimmung. Die Mütze zurückgeben und nachfragen.'],
['Zwei Personen sind unterschiedlicher Meinung darüber, ob ein gemeinsames Bild online gestellt werden soll. Was ist eine faire Lösung?','Das Bild nicht veröffentlichen, solange nicht alle betroffenen Personen einverstanden sind. Gemeinsam nach einer Alternative suchen.'],
['Warum reicht ein Ja nicht immer aus, wenn eine Person sich bedroht oder abhängig fühlt?','Weil Angst, Druck oder ein Machtgefälle die freie Entscheidung beeinträchtigen können. Zustimmung muss freiwillig sein.'],
['Ein Freund sagt: „Wenn du wirklich mein Freund bist, machst du das.“ Was ist an dieser Aussage problematisch?','Sie setzt emotional unter Druck. Freundschaft bedeutet nicht, persönliche Grenzen aufgeben zu müssen.'],
['Eine Person ist sich unsicher und sagt: „Vielleicht später.“ Wie sollte man reagieren?','Das nicht als Ja verstehen. Die Unsicherheit respektieren und nicht weiter drängen.'],
['Wie kannst du helfen, wenn du siehst, dass jemand in einer Gruppe zu etwas gedrängt wird?','Ruhig Unterstützung anbieten, den Druck unterbrechen, die Grenze der Person respektieren und bei Bedarf Hilfe holen.']];

function save(){try{localStorage.setItem('cg-arcade-v1',JSON.stringify(state))}catch(e){}}
function snap(){state.history.push(JSON.stringify({...state,history:[]}));if(state.history.length>20)state.history.shift()}
function token(i,cl=''){return `<img class="token ${cl}" src="assets/token${i}.webp" alt="${FIG[i]} aus Metall">`}
function btn(t,a,cl=''){return `<button class="btn ${cl}" data-act="${a}">${t}</button>`}
function sound(){if(!state.sound)return;try{let ctx=new (window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(550,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(880,ctx.currentTime+.15);g.gain.setValueAtTime(.045,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.23);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.25);o.onended=()=>ctx.close()}catch(e){}}
const bgTrack=new Audio('assets/casino_lounge_loop.ogg');
bgTrack.loop=true;bgTrack.volume=.42;bgTrack.preload='auto';
const winTrack=new Audio('assets/champion_fanfare.ogg');
winTrack.volume=.38;winTrack.preload='auto';
let audioNotice='';
function syncMusic(){
 if(!state.music||!state.sound||screen==='end'){
   bgTrack.pause();return;
 }
 winTrack.pause();winTrack.currentTime=0;
 let attempt=bgTrack.play();
 if(attempt&&attempt.catch)attempt.catch(()=>{audioNotice='Tippe auf MUSIK STARTEN, um die Hintergrundmusik zu aktivieren.';refreshAudioButton()});refreshAudioButton();
}
function ensureMusic(){syncMusic()}
function stopMusic(){bgTrack.pause();winTrack.pause()}
function refreshAudioButton(){const b=document.querySelector('#music-control');if(b)b.textContent=screen==='end'?(winTrack.paused?'▶ FINALE-SOUND':'♫ FINALE LÄUFT'):state.music&&state.sound?(bgTrack.paused?'▶ MUSIK STARTEN':'♫ MUSIK LÄUFT'):'♪ MUSIK AUS';}
function playFinale(){
 bgTrack.pause();
 if(!state.sound||!state.music)return;
 winTrack.currentTime=0;
 let attempt=winTrack.play();
 if(attempt&&attempt.catch)attempt.catch(()=>{audioNotice='Tippe auf FINALE-SOUND STARTEN.';refreshAudioButton()});refreshAudioButton();
}
function startTimer(){clearInterval(timerHandle);timerHandle=null;questionDeadline=null;if(!state.timer)return;questionDeadline=Date.now()+state.timer*1000;updateTimer();timerHandle=setInterval(updateTimer,100)}
function stopTimer(){clearInterval(timerHandle);timerHandle=null;questionDeadline=null}
function updateTimer(){let el=document.querySelector('#question-timer');if(!el||!questionDeadline)return;let remaining=Math.max(0,Math.ceil((questionDeadline-Date.now())/1000));el.textContent=remaining?'⏱ '+remaining+' SEKUNDEN':'⏱ ZEIT ABGELAUFEN';el.classList.toggle('timer-urgent',remaining<=5);if(!remaining){clearInterval(timerHandle);timerHandle=null;questionDeadline=null;sound()}}
function timerMarkup(){return state.timer?'<div id="question-timer" class="question-timer" role="timer" aria-live="off">⏱ '+state.timer+' SEKUNDEN</div>':''}
function scorebar(){return `<div class="scoreboard">${state.players.map((p,i)=>`<div class="score ${state.turn===i?'active':''}">${token(p.fig,'small')}<span class="score-name">${esc(p.name)}</span><span class="score-num" id="score-${i}"><span class="coin-symbol">CG</span> ${p.points}</span></div>`).join('')}</div>`}
function pick(type){let pool=type==='normal'?NORMAL:BONUS;if(!Array.isArray(state.used[type]))state.used[type]=[];if(state.used[type].length>=pool.length)state.used[type]=[];let choices=pool.map((_,i)=>i).filter(i=>!state.used[type].includes(i));let n=choices[Math.floor(Math.random()*choices.length)];state.used[type].push(n);return {type,text:pool[n][0],answer:pool[n][1]}}
function go(s){if(s!=='game'&&s!=='tie')stopTimer();screen=s;notice='';draw();if(s!=='end'&&state.music&&state.sound)syncMusic()}
function draw(){app.innerHTML=`<div class="stage">${render()}</div>`;$('#sound').textContent=state.sound?'♫':'♪';refreshAudioButton();app.querySelectorAll('[data-act]').forEach(el=>el.onclick=()=>action(el.dataset.act));app.querySelectorAll('[data-timer]').forEach(el=>el.onclick=()=>{state.timer=+el.dataset.timer;save();draw()});app.querySelectorAll('[data-count]').forEach(el=>el.onclick=()=>{state.count=+el.dataset.count;save();draw()});app.querySelectorAll('[data-fig]').forEach(el=>el.onclick=()=>{selectedFigure=+el.dataset.fig;draw()});app.querySelectorAll('[data-field]').forEach(el=>el.onclick=()=>chooseField(el.dataset.field));let input=$('#playername');if(input){input.oninput=e=>draftName=e.target.value;input.onkeydown=e=>{if(e.key==='Enter')action('addplayer')}}if(screen==='end'&&!winStarted){winStarted=true;startFinale();playFinale()}}
function render(){if(screen==='home')return `<section class="hero"><div class="eyebrow">DAS LERNSPIEL ZUM ECHTEN BRETT</div><div class="marquee"><div class="hero-logo">CONSENT<br><span>GAMBLE</span></div></div><p class="subtitle">WISSEN. RESPEKT. GRENZEN.<br>Sammle Coins mit deinem Wissen.</p></section><div class="card gold" style="text-align:center"><div class="eyebrow">WISSEN IST DEIN JACKPOT</div>${btn('▶ SPIEL STARTEN','new')}${state.players.length?btn('↻ SPIEL FORTSETZEN','resume','alt'):''}${btn('WAS IST CONSENT?','consent','alt')}${btn('SPIELREGELN','rules','alt')}</div><div class="lobby-signature" aria-label="Wissen, Respekt und Grenzen"><span class="signature-line"></span><div class="signature-coin" aria-hidden="true"><span>CG</span></div><span class="signature-line"></span></div><div class="lobby-motto"><span>WISSEN</span><i></i><span>RESPEKT</span><i></i><span>GRENZEN</span></div>`;
if(screen==='consent')return `<div class="eyebrow">BEVOR ES LOSGEHT</div><h1 class="title">WAS IST <span style="color:var(--gold)">CONSENT?</span></h1><div class="card gold rules"><div class="eyebrow">EINVERSTÄNDNIS · RESPEKT · GRENZEN</div><h2 style="color:var(--gold);font-size:clamp(23px,6vw,34px);margin:12px 0">Consent heißt: Alle sind freiwillig einverstanden.</h2><p>Consent (gesprochen: <b>Kon-sent</b>) bedeutet <b>Einverständnis</b>. Jede Person darf selbst entscheiden, was für sie okay ist – zum Beispiel bei Berührungen, Umarmungen, Küssen oder beim Teilen von Fotos.</p></div><div class="card rules"><h3>✓ Ein echtes Ja ist freiwillig</h3><p>Niemand darf überredet, unter Druck gesetzt oder zu etwas gezwungen werden. Ein Ja zählt nur, wenn die Person frei entscheiden kann.</p><h3>✓ Fragen statt vermuten</h3><p>„Ist das okay für dich?“ oder „Möchtest du das?“ – nachfragen zeigt Respekt.</p><h3>✓ Nein heißt Nein</h3><p>Auch Schweigen, Unsicherheit oder Zögern sind kein Ja. Wenn du nicht sicher bist, hör auf und frag nach.</p><h3>✓ Ein Ja kann sich ändern</h3><p>Jede Person kann ihre Meinung jederzeit ändern. Auch wenn etwas vorher okay war, muss es das jetzt nicht mehr sein.</p><h3>✓ Grenzen gelten für alle</h3><p>Deine Grenzen sind wichtig – und die Grenzen anderer genauso.</p></div><div class="card blue rules"><div class="eyebrow">BEISPIEL AUS DEM ALLTAG</div><p><b>Alex:</b> „Darf ich dich umarmen?“</p><p><b>Sam:</b> „Lieber nicht.“</p><p><b>Alex:</b> „Alles klar!“</p><p class="muted">So einfach kann respektvoller Umgang sein. Niemand muss ein Nein begründen.</p></div><div class="card gold" style="text-align:center"><h3>MERK DIR:</h3><p style="font-size:19px;font-weight:800">Nur ein freiwilliges Ja ist ein Ja.</p><p class="muted">Im Spiel sammelt ihr Coins, indem ihr über Consent, Respekt und persönliche Grenzen nachdenkt.</p></div>${btn('VERSTANDEN · ZURÜCK','back','alt')}`;
if(screen==='rules')return `<div class="eyebrow">SO FUNKTIONIERT’S</div><h1 class="title">SPIELREGELN</h1><div class="card rules"><h3>1 · Gemeinsam spielen</h3><p>2–4 Personen spielen am echten Brett und nutzen gemeinsam dieses Handy. Wählt eure Figuren und Namen.</p><h3>2 · Glücksrad drehen</h3><p>Wer an der Reihe ist, dreht das echte Glücksrad und zieht die angezeigten 1–3 Felder auf dem Brett.</p><h3>3 · Das Feld entscheidet</h3><p><b>Blaues F:</b> normale Frage (+1 Punkt bei richtiger Antwort). <b>Gelbes F:</b> Bonusfrage (+2 Punkte). <b>Weiß:</b> keine Frage.</p><h3>4 · Mündlich antworten</h3><p>Antwortet zuerst laut, deckt dann die Musterantwort auf und entscheidet fair, ob die Antwort richtig war.</p><h3>5 · Ziel & Finale</h3><p>Die erste Person am Ziel erhält +2 Punkte. Danach wird die laufende Runde beendet, damit alle gleich viele Züge hatten. Die höchste Punktzahl gewinnt. Bei Gleichstand gibt es Stichfragen.</p><h3>6 · Wichtig</h3><p>Bei Consent geht es um freiwillige Zustimmung, Grenzen und Respekt. Die Coins sind nur Lernpunkte – es gibt keine Einsätze oder echtes Geld.</p></div>${btn('ZURÜCK','back','alt')}`;
if(screen==='setup')return `<div class="eyebrow">NEUES SPIEL</div><h1 class="title">WIE VIELE SPIELEN?</h1><div class="card gold"><div class="count">${[2,3,4].map(n=>`<button data-count="${n}" class="${state.count===n?'selected':''}">${n}</button>`).join('')}</div><p class="muted">Ein Handy. Ein echtes Brett. Alle zusammen.</p><div class="settings-label">ZEIT PRO FRAGE</div><div class="timer-options">${[0,15,30].map(t=>`<button data-timer="${t}" class="${state.timer===t?'selected':''}">${t?t+' SEK.':'OHNE TIMER'}</button>`).join('')}</div><div class="settings-label">HINTERGRUNDMUSIK</div><button class="btn alt" data-act="music">${state.music?'♫ MUSIK AN':'♪ MUSIK AUS'}</button>${btn('WEITER →','setupnext')}</div>`;
if(screen==='register'){let n=state.players.length+1;return `<div class="eyebrow">SPIELER ${n} VON ${state.count}</div><h1 class="title">WÄHLE DEINE FIGUR</h1><p class="muted">Metallisch gerenderte Figuren, inspiriert von euren Spielfiguren.</p><div class="fig-grid">${FIG.map((f,i)=>`<button class="fig ${selectedFigure===i?'selected':''}" data-fig="${i}" ${state.players.some(p=>p.fig===i)?'disabled':''}>${token(i)}<small>${f}</small></button>`).join('')}</div><label class="field-label" for="playername">DEIN SPIELERNAME</label><input id="playername" class="input" maxlength="16" placeholder="Name eingeben" autocomplete="off" value="${esc(draftName)}">${notice?`<div class="alert">${esc(notice)}</div>`:''}${btn(n===state.count?'SPIEL BEGINNEN ▶':'SPIELER HINZUFÜGEN →','addplayer')}${btn('ZURÜCK','backregister','alt')}`}
if(screen==='game'){let p=state.players[state.turn];if(!p)return btn('ZUR STARTSEITE','home');let body='';if(state.phase==='turn')body=`<div class="turn-intro"><div class="eyebrow">RUNDE ${state.round} · DU BIST DRAN</div><div class="card gold">${token(p.fig,'big')}<h2>${esc(p.name)}, DEIN ZUG!</h2><p class="muted">Dreh das echte Glücksrad, zieh deine Figur und wähle das Feld.</p></div></div><div class="eyebrow">AUF WELCHEM FELD BIST DU?</div><div class="fields"><button class="field" data-field="normal">F<small>BLAU · 1 PUNKT</small></button><button class="field bonus" data-field="bonus">2×<small>GELB · 2 PUNKTE</small></button><button class="field empty" data-field="none">—<small>WEISS · LEER</small></button></div>`;
if(state.phase==='question'){let q=state.question;body=`<div class="card ${q.type==='bonus'?'gold':'blue'}" id="question-origin"><span class="chip ${q.type==='bonus'?'yellow':'blue'}">${q.type==='bonus'?'BONUSFRAGE · +2 COINS':'NORMALE FRAGE · +1 COIN'}</span>${timerMarkup()}<div class="question"><h2>${esc(q.text)}</h2><p class="mini">Erst mündlich antworten, dann aufdecken.</p></div></div>${showAnswer?`<div class="answer"><b>MUSTERANTWORT</b><p>${esc(q.answer)}</p></div><div class="row">${btn('✓ RICHTIG','correct','green')}${btn('✕ NICHT GANZ','wrong','red')}</div>`:btn('ANTWORT ANZEIGEN','reveal')}`}
if(state.phase==='finish')body=`<div class="card gold turn-intro"><div class="eyebrow">${celebration?'RICHTIG! · COINS GESAMMELT':'ZUG ABSCHLIESSEN'}</div>${token(p.fig,celebration?'big jump':'big')}<h2>${esc(p.name)} · ${p.points} COINS</h2><p class="muted">Prüft jetzt, ob die Figur das Ziel erreicht hat.</p></div>${state.firstFinisher===null?btn('🏁 ALS ERSTE PERSON IM ZIEL · +2 COINS','goal'):state.firstFinisher===state.turn?'<div class="status">✓ Zielbonus von 2 Punkten erhalten</div>':'<div class="status">Der Zielbonus wurde bereits vergeben.</div>'}${btn('ZUG ABSCHLIESSEN →','next','alt')}`;
return `${scorebar()}${body}<div class="status"><button class="tool" style="font-size:12px;width:auto;padding:0 12px" data-act="undo">↶ LETZTE AKTION RÜCKGÄNGIG</button></div>`}
if(screen==='tie'){let idx=state.tieCandidates[state.tieIndex],p=state.players[idx],q=state.tieQuestion;return `${scorebar()}<div class="eyebrow">FINALE · GLEICHSTAND</div><h1 class="title">STICHFRAGE!</h1><div class="card gold">${token(p.fig,'mid')}<h2>${esc(p.name)} IST DRAN</h2>${timerMarkup()}<div class="question"><h2>${esc(q.text)}</h2></div></div>${state.tieShown?`<div class="answer">${esc(q.answer)}</div><div class="row">${btn('✓ RICHTIG','tiecorrect','green')}${btn('✕ NICHT GANZ','tiewrong','red')}</div>`:btn('ANTWORT ANZEIGEN','tiereveal')}`}
if(screen==='end'){let rank=[...state.players].sort((a,b)=>(a===state.players[state.winnerOverride]?-1:b===state.players[state.winnerOverride]?1:b.points-a.points)),top=rank.slice(0,3);let pod=(i,cl,d)=>{let p=top[i];return p?`<div class="pod ${cl}" style="--delay:${d}s">${token(p.fig,cl==='first'?'winner':cl==='second'?'second':'third')}<span class="pod-name">${esc(p.name)}<br>${p.points} COINS</span><div class="pedestal">${i+1}</div></div>`:'<div class="pod"></div>'};return `<div class="eyebrow" style="text-align:center;margin-top:25px">DAS GROSSE FINALE</div><div class="champion">CHAMPION!</div><div class="finale-tagline">WISSEN IST DEIN JACKPOT</div><h2 style="text-align:center;color:var(--gold);margin:10px">${esc(rank[0].name)} GEWINNT!</h2><div class="podium">${pod(1,'second',.35)}${pod(0,'first',.8)}${pod(2,'third',.55)}</div><div class="winnings">${esc(rank[0].name)} hat <b>${rank[0].points} Wissens-Coins</b> gesammelt!</div><div class="card"><div class="eyebrow">DEINE COINS · ENDSTAND</div><div class="ranklist">${rank.map((p,i)=>`<div class="rank"><span class="place">${i+1}.</span>${token(p.fig,'small')}<strong>${esc(p.name)}</strong><span class="score-num">${p.points} COINS</span></div>`).join('')}</div></div>${btn('↻ NOCHMAL MIT DENSELBEN SPIELERN','replay')}${btn('ZUR STARTSEITE','home','alt')}`}
return ''}
function validName(name){if(name.length<2||name.length>16)return 'Bitte wähle einen Namen mit 2–16 Zeichen.';if(!/^[\p{L}\p{M}0-9 _.-]+$/u.test(name))return 'Bitte nur Buchstaben, Zahlen und einfache Satzzeichen verwenden.';let n=name.normalize('NFKD').toLowerCase().replace(/[̀-ͯ]/g,'').replace(/[013457@$!|]/g,c=>({'0':'o','1':'i','3':'e','4':'a','5':'s','7':'t','@':'a','$':'s','!':'i','|':'i'}[c])).replace(/[^a-z]/g,'');if(['nigger','nigga','neger','heilhitler','siegheil','hitler','nazi','fickdich','hurensohn','fotze','schlampe','kanake','spasti','schwuchtel','arschloch'].some(w=>n.includes(w)))return 'Bitte wähle einen respektvollen Spielernamen.';if(state.players.some(p=>p.name.toLowerCase()===name.toLowerCase()))return 'Dieser Name ist bereits vergeben.';return ''}
function chooseField(type){stopTimer();snap();celebration=false;if(type==='none'){state.phase='finish';state.question=null}else{state.question=pick(type);state.phase='question';showAnswer=false}sound();save();draw();if(type!=='none')startTimer()}
function next(){celebration=false;if(state.finishRound!==null&&state.turn===state.players.length-1){endGame();return}state.turn=(state.turn+1)%state.players.length;if(state.turn===0)state.round++;state.phase='turn';state.question=null;save();draw()}
function endGame(){let mx=Math.max(...state.players.map(p=>p.points));let tied=state.players.map((p,i)=>p.points===mx?i:-1).filter(i=>i>=0);if(tied.length>1){state.tieCandidates=tied;state.tieIndex=0;state.tieVotes={};state.tieQuestion=pick('bonus');state.tieShown=false;go('tie');startTimer()}else{state.ended=true;winStarted=false;go('end')}save()}
function tieVote(correct){stopTimer();let idx=state.tieCandidates[state.tieIndex];state.tieVotes[idx]=correct?1:0;state.tieIndex++;if(state.tieIndex<state.tieCandidates.length){state.tieQuestion=pick('bonus');state.tieShown=false;save();draw();startTimer();return}else{let mx=Math.max(...Object.values(state.tieVotes));let winners=state.tieCandidates.filter(i=>state.tieVotes[i]===mx);if(winners.length===1){state.winnerOverride=winners[0];state.ended=true;winStarted=false;go('end')}else{state.tieCandidates=winners;state.tieIndex=0;state.tieQuestion=pick('bonus');state.tieVotes={};state.tieShown=false}}save();draw()}
function startFinale(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){confetti(40);return}
  let veil=document.createElement('div');veil.className='finale-veil';veil.innerHTML='<div class="countdown-num">3</div><div class="countdown-caption">DAS GROSSE FINALE</div>';document.body.appendChild(veil);
  let nums=['3','2','1','CHAMPION!'];nums.forEach((n,i)=>setTimeout(()=>{let t=veil.querySelector('.countdown-num');if(t){t.textContent=n;t.style.animation='none';void t.offsetWidth;t.style.animation='countPop .75s ease-out both'}sound()},i*750));
  setTimeout(()=>{veil.remove();confetti(130);showerCoins(28)},3100);
}
function showerCoins(n){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<n;i++){let c=document.createElement('i');c.className='raining-coin';c.textContent='CG';c.style.left=(Math.random()*100)+'vw';c.style.setProperty('--dur',(2+Math.random()*2.8)+'s');c.style.setProperty('--delay',(Math.random()*1.6)+'s');document.body.appendChild(c);setTimeout(()=>c.remove(),6800)}}
function confetti(n){for(let i=0;i<n;i++){let d=document.createElement('i');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.setProperty('--dur',2+Math.random()*3+'s');d.style.setProperty('--delay',Math.random()*1.8+'s');d.style.setProperty('--drift',(Math.random()-.5)*280+'px');d.style.setProperty('--color',['#ffd36b','#f5a4ff','#7bdfff','#fff','#c0b5ff'][i%5]);document.body.appendChild(d);setTimeout(()=>d.remove(),6500)}}
function coinAnimation(amount,done){let start=$('#question-origin'),dest=$('#score-'+state.turn);if(!start||!dest||window.matchMedia('(prefers-reduced-motion: reduce)').matches){done();return}let a=start.getBoundingClientRect(),b=dest.getBoundingClientRect(),sx=a.left+a.width*.5,sy=a.top+a.height*.45,ex=b.left+b.width*.6,ey=b.top+b.height*.5;let overlay=document.createElement('div');overlay.className='successflash';document.body.appendChild(overlay);setTimeout(()=>overlay.remove(),850);for(let i=0;i<amount;i++){let coin=document.createElement('div');coin.className='flying-coin';coin.textContent='CG';coin.style.setProperty('--sx',sx-16+'px');coin.style.setProperty('--sy',sy-16+'px');coin.style.setProperty('--ex',ex-16+'px');coin.style.setProperty('--ey',ey-16+'px');coin.style.animationDelay=i*160+'ms';document.body.appendChild(coin);setTimeout(()=>coin.remove(),1400)}setTimeout(done,1000+amount*160)}
function action(a){if(animationLock)return;if(a==='rules'||a==='consent'){returnScreen=screen;go(a);return}if(a==='back'){go(returnScreen);return}if(a==='home'){go('home');return}if(a==='music'){state.music=!state.music;save();if(state.music)ensureMusic();else stopMusic();draw();return}if(a==='new'){if(state.players.length&&!confirm('Neues Spiel beginnen? Der bisherige Spielstand wird gelöscht.'))return;let previousSound=state.sound,previousMusic=state.music;state=initial();state.sound=previousSound;state.music=previousMusic;save();go('setup');return}if(a==='resume'){go(state.ended?'end':state.tieCandidates.length?'tie':'game');return}if(a==='setupnext'){ensureMusic();state.players=[];draftName='';selectedFigure=0;go('register');return}if(a==='backregister'){if(state.players.length){state.players.pop();save();go('register')}else go('setup');return}if(a==='addplayer'){let name=draftName.trim(),error=validName(name);if(error){notice=error;draw();return}state.players.push({name,fig:selectedFigure,points:0});draftName='';notice='';sound();save();if(state.players.length===state.count){state.turn=0;state.round=1;state.phase='turn';go('game')}else{selectedFigure=FIG.findIndex((_,i)=>!state.players.some(p=>p.fig===i));go('register')}return}if(a==='reveal'){stopTimer();showAnswer=true;sound();draw();return}if(a==='correct'||a==='wrong'){snap();let amount=a==='correct'?(state.question.type==='bonus'?2:1):0;animationLock=true;let finish=()=>{state.players[state.turn].points+=amount;state.phase='finish';celebration=amount>0;animationLock=false;save();sound();draw()};if(amount){coinAnimation(amount,finish)}else finish();return}if(a==='goal'){if(state.firstFinisher===null){snap();state.firstFinisher=state.turn;state.finishRound=state.round;state.players[state.turn].points+=2;save();sound();draw()}return}if(a==='next'){snap();next();return}if(a==='undo'){if(!state.history.length){alert('Es gibt noch keine Aktion zum Rückgängigmachen.');return}let old=state.history.pop(),hist=state.history;state=JSON.parse(old);state.history=hist;showAnswer=state.phase==='question';celebration=false;save();draw();return}if(a==='replay'){stopTimer();let players=state.players.map(p=>({...p,points:0})),setting=state.sound,musicSetting=state.music,timerSetting=state.timer;state=initial();state.players=players;state.count=players.length;state.sound=setting;state.music=musicSetting;state.timer=timerSetting;save();go('game');return}if(a==='tiereveal'){stopTimer();state.tieShown=true;draw();return}if(a==='tiecorrect'||a==='tiewrong'){tieVote(a==='tiecorrect');return}}
$('#sound').onclick=()=>{state.sound=!state.sound;save();if(state.sound){sound();if(screen==='end')playFinale();else ensureMusic()}else stopMusic();draw()};$('#music-control').onclick=()=>{if(screen==='end'){if(winTrack.paused){state.music=true;state.sound=true;playFinale()}else winTrack.pause()}else if(bgTrack.paused){state.music=true;state.sound=true;syncMusic()}else{state.music=false;bgTrack.pause()}save();refreshAudioButton()};$('#rules').onclick=()=>action('rules');$('#home').onclick=()=>action('home');draw();
</script></body></html>
